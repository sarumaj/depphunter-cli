# Converted from .github/workflows/ci.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: CI
'on':
  push:
    branches:
    - main
    - renovate/all-patch
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        go:
        - stable
        include:
        - os: ubuntu-latest
          go: oldest
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
    - uses: https://github.com/actions/checkout@v7
    - uses: https://github.com/actions/setup-go@v5
      with:
        go-version: ${{ matrix.go != 'oldest' && matrix.go || '' }}
        go-version-file: ${{ matrix.go == 'oldest' && 'go.mod' || '' }}
    - name: Build
      run: go build ./...
    - name: Install gopls
      if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
      run: go install golang.org/x/tools/gopls@latest
    - name: Test
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi
  lint:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
    - uses: https://github.com/actions/checkout@v7
    - uses: https://github.com/actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: gofmt
      run: |
        # testdata holds deliberately broken sources; vendor/ is upstream code,
        # formatted however its authors left it.
        unformatted=$(git ls-files '*.go' ':!:**/testdata/**' ':!:vendor/**' | xargs gofmt -l)
        if [ -n "$unformatted" ]; then
          echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1
        fi
    - name: go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
    - name: go vet
      run: go vet ./...
    - name: staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
    - uses: https://github.com/actions/setup-node@v7
      with:
        node-version: 22
    - name: JavaScript syntax
      run: find web/static -name '*.js' -not -path 'web/static/vendor/*' -print0 | xargs -0 -n1 node --check
    - name: markdownlint
      run: npx --yes markdownlint-cli@0.41.0 '**/*.md' --ignore '**/testdata/**' --ignore node_modules
    - name: Requirements traceability
      run: node scripts/reqtrace.mjs --check
  extension:
    runs-on: ubuntu-latest
    steps:
    - uses: https://github.com/actions/checkout@v7
      with:
        lfs: true
    - name: Check the LFS files are real
      run: |
        if grep -rlx 'version https://git-lfs.github.com/spec/v1' web/static; then
          echo "::error::LFS pointers instead of content (above)"; exit 1
        fi
    - uses: https://github.com/actions/setup-go@v5
      with:
        go-version: stable
    - uses: https://github.com/actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
    - name: Install
      run: npm ci
    - name: Type-check
      run: npm run lint
    - name: Build depphunter
      run: |
        go build -o depphunter ./cmd/depphunter
        mkdir -p bin && cp depphunter bin/depphunter
    - name: Test
      run: npm test
      env:
        DEPPHUNTER: ${{ github.workspace }}/depphunter
    - name: Package
      run: npx @vscode/vsce@4 package --target linux-x64 --out depphunter.vsix
    - name: Check it carries the binary
      run: |
        unzip -p depphunter.vsix extension/bin/depphunter > packaged
        chmod +x packaged
        ./packaged --version
  vulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: https://github.com/actions/checkout@v7
    - uses: https://github.com/actions/setup-go@v5
      with:
        go-version: stable
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  dist:
    runs-on: ubuntu-latest
    steps:
    - uses: https://github.com/actions/checkout@v7
      with:
        lfs: true
    - name: Check the LFS files are real
      run: |
        if grep -rlx 'version https://git-lfs.github.com/spec/v1' web/static; then
          echo "::error::LFS pointers instead of content (above)"; exit 1
        fi
    - uses: https://github.com/actions/setup-go@v5
      with:
        go-version: stable
    - name: Test on 32-bit
      run: GOARCH=386 CGO_ENABLED=0 go test ./...
    - name: Build
      run: scripts/dist.sh "${GITHUB_SHA::7}"
    - name: Smoke test
      run: |
        test "$(ls dist/depphunter_*.tar.gz dist/depphunter_*.zip | wc -l)" -eq 12
        (cd dist && sha256sum -c checksums.txt)
        tar -xzf dist/depphunter_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
        "$RUNNER_TEMP"/depphunter_*_linux_amd64/depphunter --version
