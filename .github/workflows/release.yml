name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Build with the current Go so binaries carry an up-to-date standard library;
          # go.mod only states the oldest Go that can build the code.
          go-version: stable
      - name: Test
        run: go test -race ./...
      - name: Build
        # Every target in scripts/dist.sh: Linux (amd64, arm64, armv7, 386, riscv64),
        # macOS (amd64, arm64), Windows (amd64, arm64, 386), FreeBSD (amd64, arm64).
        run: scripts/dist.sh "${{ github.ref_name }}"
      - name: Smoke test
        run: |
          tar -xzf dist/depphunter_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/depphunter_*_linux_amd64/depphunter --version | grep -F "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the VS Code extension
        # Released with the binary and carrying the same version, so "the extension
        # from v1.2.3" is one file and not a question. A tag the marketplace would
        # not take as a version (a release candidate, say) leaves the manifest's own
        # version alone rather than failing the release.
        working-directory: extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::$TAG is not a plain x.y.z; packaging the manifest version"
            version=""
          fi
          npm ci
          npx @vscode/vsce@4 package $version --no-git-tag-version \
            --out "../dist/depphunter_${TAG#v}_vscode.vsix"
          (cd ../dist && sha256sum "depphunter_${TAG#v}_vscode.vsix" >> checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --verify-tag
