name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with the current Go so binaries carry an up-to-date standard library;
          # go.mod only states the oldest Go that can build the code.
          go-version: stable
      - name: Test
        run: go test -race ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          # Pure Go: every target cross-compiles from one runner.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*} goarch=${target#*/}
            name="depphunter_${VERSION#v}_${goos}_${goarch}"
            ext=""; [ "$goos" = windows ] && ext=.exe
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/depphunter$ext" ./cmd/depphunter
            cp README.md LICENSE "dist/$name/"
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --verify-tag
