name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vsix.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The 3D models in web/static are in LFS and embedded in the binary.
          lfs: true
      - name: Check the LFS files are real
        # web/static is embedded in the binary; a pointer file there ships as a
        # model that will not load, and nothing else would notice.
        run: |
          if grep -rlx 'version https://git-lfs.github.com/spec/v1' web/static; then
            echo "::error::LFS pointers instead of content (above)"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          # Build with the current Go so binaries carry an up-to-date standard library;
          # go.mod only states the oldest Go that can build the code.
          go-version: stable
      - name: Test
        run: go test -race ./...
      - name: Build
        # Every target in scripts/dist.sh: Linux (amd64, arm64, armv7, 386, riscv64),
        # macOS (amd64, arm64), Windows (amd64, arm64, 386), FreeBSD (amd64, arm64).
        run: scripts/dist.sh "${{ github.ref_name }}"
      - name: Smoke test
        run: |
          tar -xzf dist/depphunter_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/depphunter_*_linux_amd64/depphunter --version | grep -F "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the VS Code extension
        id: vsix
        # One VSIX per platform, each carrying the binary for that platform, all of
        # them the tag's version: installing the extension installs the server it
        # starts, pinned to it, and "the extension from v1.2.3" is one file and not
        # a question. The marketplace hands each machine the one that matches, and
        # the universal build at the end is for anything not on this list, which
        # falls back to whatever depphunter is on the PATH.
        #
        # A tag the marketplace would not take as a version (a release candidate,
        # say) leaves the manifest's own version alone rather than failing the
        # release.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::$TAG is not a plain x.y.z; packaging the manifest version"
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm ci
          # vsce's target, then the Go platform to build the binary it carries.
          # alpine is musl, which a cgo-free static build runs on unchanged.
          for spec in \
            win32-x64:windows:amd64: win32-arm64:windows:arm64: \
            linux-x64:linux:amd64 linux-arm64:linux:arm64 linux-armhf:linux:arm:7 \
            darwin-x64:darwin:amd64 darwin-arm64:darwin:arm64 \
            alpine-x64:linux:amd64 alpine-arm64:linux:arm64
          do
            IFS=: read -r target goos goarch goarm <<< "$spec"
            ext=""; [ "$goos" = windows ] && ext=.exe
            rm -rf bin && mkdir bin
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch GOARM=$goarm go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "bin/depphunter$ext" ./cmd/depphunter
            npx @vscode/vsce@4 package $version --no-git-tag-version --target "$target" \
              --out "dist/depphunter_${TAG#v}_vscode_${target}.vsix"
          done
          rm -rf bin
          npx @vscode/vsce@4 package $version --no-git-tag-version \
            --out "dist/depphunter_${TAG#v}_vscode_universal.vsix"
          (cd dist && sha256sum depphunter_*_vscode_*.vsix >> checksums.txt)
      - name: Publish
        # A re-run of the same tag replaces the assets on the release that is already
        # there rather than failing: the notes on an existing release may have been
        # edited by hand since, so only the assets are rewritten.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
      # Every VSIX goes to both registries, which read each one's target from the
      # package itself and serve the universal one wherever no target matches. A tag
      # packaged under the manifest's version is not published: that version is
      # either already there or not the one the tag names.
      #
      # --skip-duplicate passes over a target whose version the registry already has,
      # so a re-run after a partial publish finishes the rest instead of failing on
      # the first one that got through.
      - name: Publish to Visual Studio Marketplace
        if: steps.vsix.outputs.version != ''
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: npx @vscode/vsce@4 publish --skip-duplicate --packagePath dist/*_vscode_*.vsix
      - name: Publish to Open VSX Registry
        if: steps.vsix.outputs.version != ''
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx --yes ovsx@1 publish --skip-duplicate --packagePath dist/*_vscode_*.vsix
