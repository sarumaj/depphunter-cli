name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Implements: REQ-DIST-010
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # The oldest supported Go: exactly the version go.mod states, so go.mod
          # cannot claim less than the code and its dependencies need.
          # GOTOOLCHAIN=local makes the build fail instead of silently downloading
          # a newer toolchain.
          # Implements: REQ-DIST-011, REQ-DIST-018
          - os: ubuntu-latest
            go: oldest
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'oldest' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'oldest' && 'go.mod' || '' }}
      - name: Build
        run: go build ./...
      - name: Install gopls
        # Lets the language-server test run (it skips without gopls). Current gopls
        # needs a newer Go than the oldest one supported, so only here.
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go install golang.org/x/tools/gopls@latest
      - name: Test
        shell: bash
        # The race detector needs cgo, which the Windows runner's toolchain lacks.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

  # Implements: REQ-DIST-012
  lint:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # staticcheck must be built with a Go at least as new as go.mod's.
          go-version-file: go.mod
      - name: gofmt
        run: |
          # testdata holds deliberately broken sources; vendor/ is upstream code,
          # formatted however its authors left it.
          unformatted=$(git ls-files '*.go' ':!:**/testdata/**' ':!:vendor/**' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        # Our own modules only: the vendored libraries are shipped as their authors
        # built them (see web/static/vendor/README.md).
        run: for f in web/static/*.js; do node --check "$f"; done
      - name: markdownlint
        run: npx --yes markdownlint-cli@0.41.0 '**/*.md' --ignore '**/testdata/**' --ignore node_modules
      - name: Requirements traceability
        # Every Implements:/Verifies: annotation must name a requirement in
        # docs/requirements, and the matrix generated from them must be current.
        run: node tools/reqtrace.mjs --check

  extension:
    # The VS Code extension is TypeScript and a manifest, neither of which the Go
    # jobs above see: type-check it, and package it, because a manifest vsce will
    # not package is one that cannot be published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The 3D models in web/static are in LFS and embedded in the binary.
          lfs: true
      - name: Check the LFS files are real
        # web/static is embedded in the binary; a pointer file there ships as a
        # model that will not load, and nothing else would notice.
        run: |
          if grep -rlx 'version https://git-lfs.github.com/spec/v1' web/static; then
            echo "::error::LFS pointers instead of content (above)"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build depphunter
        # The extension's tests run the real thing: an argument it stops accepting
        # is exactly what they are there to catch. bin/ is where a released VSIX
        # keeps the binary it ships, so packaging below carries this one and proves
        # the bundling works rather than only the manifest.
        run: |
          go build -o depphunter ./cmd/depphunter
          mkdir -p bin && cp depphunter bin/depphunter
      - name: Test
        run: npm test
        env:
          DEPPHUNTER: ${{ github.workspace }}/depphunter
      - name: Package
        run: npx @vscode/vsce@4 package --target linux-x64 --out depphunter.vsix
      - name: Check it carries the binary
        run: |
          unzip -p depphunter.vsix extension/bin/depphunter > packaged
          chmod +x packaged
          ./packaged --version
      - uses: actions/upload-artifact@v4
        with:
          name: depphunter-vscode-${{ github.sha }}
          path: depphunter.vsix
          retention-days: 14

  # Implements: REQ-DIST-013, REQ-DIST-019
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Release binaries are built with the current Go; scan what users run.
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Implements: REQ-DIST-014
  dist:
    # Builds the release archives for every target on each push, so a target that
    # stops cross-compiling fails here rather than at tag time. The archives are
    # kept as workflow artifacts for testing unreleased builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The 3D models in web/static are in LFS and embedded in the binary.
          lfs: true
      - name: Check the LFS files are real
        # web/static is embedded in the binary; a pointer file there ships as a
        # model that will not load, and nothing else would notice.
        run: |
          if grep -rlx 'version https://git-lfs.github.com/spec/v1' web/static; then
            echo "::error::LFS pointers instead of content (above)"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Implements: REQ-DIST-015
      - name: Test on 32-bit
        # Releases include 386 and armv7 builds; catch int overflows on 32-bit ints.
        run: GOARCH=386 CGO_ENABLED=0 go test ./...
      - name: Build
        run: scripts/dist.sh "${GITHUB_SHA::7}"
      - name: Smoke test
        run: |
          tar -xzf dist/depphunter_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/depphunter_*_linux_amd64/depphunter --version
      - uses: actions/upload-artifact@v4
        with:
          name: depphunter-${{ github.sha }}
          path: dist/
          retention-days: 14
